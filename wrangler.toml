# Cloudflare Worker (static assets only) — serves the site at
# https://flexisoft.jakkies.workers.dev
name = "flexisoft"
compatibility_date = "2024-11-01"

[assets]
directory = "."
# `/foo` <-> `/foo.html` mapping, and `/` serves index.html (defaults).
html_handling = "auto-trailing-slash"
not_found_handling = "none"
